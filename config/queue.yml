default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  # Postgres lives on Supabase, outside the app host's network — every poll is an
  # egress round-trip. Throttled to avoid the DriveCash incident (see git log
  # 16e9730 there): default 1s dispatcher/worker polling burned through Render's
  # free bandwidth tier for a queue that barely processes any jobs.
  dispatchers:
    - polling_interval: 5
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2
