test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Supabase Storage over its S3-compatible endpoint. Path style is mandatory:
# Supabase addresses buckets as /storage/v1/s3/<bucket>/<key>, not as a
# virtual host. Private on purpose — the app serves every blob through the
# Active Storage proxy, so no URL ever points at the bucket.
supabase:
  service: S3
  endpoint: <%= ENV["SUPABASE_S3_ENDPOINT"] %>
  region: <%= ENV["SUPABASE_S3_REGION"] %>
  bucket: <%= ENV["SUPABASE_S3_BUCKET"] %>
  access_key_id: <%= ENV["SUPABASE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SUPABASE_S3_SECRET_ACCESS_KEY"] %>
  force_path_style: true
  public: false
